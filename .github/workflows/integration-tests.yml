# APPROVED PROVIDER-TEST EXCEPTION (OST-706, follow-up to OST-647).
# This workflow intentionally installs native provider CLIs (Claude Code,
# Codex, Aider, OpenCode) and passes native provider secrets
# (ANTHROPIC_API_KEY, OPENAI_API_KEY) because the subject under test IS the
# native agent adapters (agent-claude-code / agent-codex / agent-aider /
# agent-opencode). It is NOT a PR-review workflow, so it is OUTSIDE the
# OST-647 reusable AI-review policy (which standardizes PR review on the
# centralized OpenRouter lane: BeliyDym/.github/.github/workflows/ai-review.yml@v2).
# Do NOT migrate these to OpenRouter — that would stop testing the native
# CLIs this project exists to orchestrate. Secrets are consumed via the
# encrypted GitHub Actions secret store and are never printed or persisted.
name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --- Install tmux ---
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # --- Start tmux server ---
      - name: Start tmux server
        run: tmux start-server

      # --- Install agent binaries ---
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Install Aider
        run: pip install aider-chat

      - name: Install OpenCode
        run: npm install -g opencode-ai

      # --- Build project ---
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!@composio/ao-web' build

      # --- Run integration tests ---
      - name: Run integration tests
        env:
          # Native provider keys for the agent-adapter integration tests —
          # approved exception, NOT the OST-647 PR-review (OpenRouter) lane.
          # See the header comment at the top of this file.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          # Note: COMPOSIO_API_KEY is intentionally not passed here.
          # When both keys are set, the plugin prefers the Composio transport
          # which requires @composio/core SDK installed. The direct LINEAR_API_KEY
          # transport needs no extra dependencies.
        run: pnpm test:integration
